# fly.toml - Fly.io configuration for Inbox Pro
# Deploy with: fly launch (first time) or fly deploy (updates)

app = "inboxgpt"
primary_region = "dfw"

[build]
  dockerfile = ".docker/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_SSL = "true"
  DATABASE_SSL_REJECT_UNAUTHORIZED = "false"
  DATABASE_USE_AUTHENTICATED_ROLE = "true"
  NEXTAUTH_URL = "https://inboxgpt.fly.dev"
  NEXT_PUBLIC_SUPABASE_URL = "https://cmypcyozjhbctdkncoms.supabase.co"
  AI_PROVIDER = "anthropic"
  AUTH_ALLOW_PASSWORD = "false"
  # Secrets (DATABASE_URL, NEXTAUTH_SECRET, ENCRYPTION_KEY, GOOGLE_*, AZURE_*,
  # ANTHROPIC_API_KEY, OPENAI_API_KEY, NEXT_PUBLIC_SUPABASE_ANON_KEY) are set via
  # `fly secrets set` — never committed here.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
